name: Android (APK)

# 仅用于「只构建手机端」的快捷入口；
# 推送到 main 的自动构建由 build.yml 统一负责，避免重复消耗 Actions 时长
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'Debug'
        type: choice
        options: [Debug, Release]

jobs:
  build:
    name: Build PCL Neo Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # 注意：项目未配置签名，Release 产物为 app-release-unsigned.apk，
      # 需要本地 jarsigner / apksigner 签名后才能安装
      - name: Build Release APK
        if: github.event.inputs.build_type == 'Release'
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PCLNeo-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: PCLNeo-Android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
