name: Release (Windows + Android)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish desktop/PCLNeo.vbproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o out/PCLNeo
      - shell: pwsh
        run: Compress-Archive -Path out/PCLNeo/* -DestinationPath PCLNeo-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: PCLNeo-Windows-x64.zip

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      # 不跑 `sdkmanager --licenses`：新版 cmdline-tools 会查找废弃的 tools 包并失败；
      # setup-android 已自动接受许可，缺失组件由 AGP 按需下载
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/debug/*.apk

  publish:
    name: Publish Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PCLNeo-Windows-x64.zip
            dist/*.apk
