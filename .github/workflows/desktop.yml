name: Desktop (Windows)

# 仅用于「只构建电脑端」的快捷入口；
# 推送到 main 的自动构建由 build.yml 统一负责，避免重复消耗 Actions 时长
on:
  workflow_dispatch:

jobs:
  build:
    name: Build PCL Neo (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore desktop/PCLNeo.vbproj

      - name: Publish
        run: >
          dotnet publish desktop/PCLNeo.vbproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o out/PCLNeo

      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path out/PCLNeo/* -DestinationPath PCLNeo-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCLNeo-Windows-x64
          path: |
            out/PCLNeo/
            PCLNeo-Windows-x64.zip
          if-no-files-found: error
